# ~/.tmux.conf - WSL / non-NixOS mirror of programs.tmux in the NixOS config
# (suites/modules/terminal.nix). Prefix stays C-b. If the two drift, the NixOS
# file is the source; port the change here.
#
# Left out on purpose: the Claude Code remote-control session hook and the
# battery segment (no battery under WSL), and the Wayland clipboard binds.

set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"
set -g mouse on
set -g focus-events on
setw -g mode-keys vi
set -g base-index 1
set -s escape-time 0
set -g history-limit 50000

# Clipboard: OSC 52 passes through to Windows Terminal, so copy-mode yanks reach
# the Windows clipboard. Paste with Ctrl+Shift+V in the terminal.
set -g set-clipboard on
set -g allow-passthrough on

bind-key -r f run-shell "tmux neww tmux-sessionizer"

# Mnemonic splits (| side by side, - stacked) replace the default % and ".
unbind '"'
unbind %
bind-key | split-window -h -c "#{pane_current_path}"
bind-key - split-window -v -c "#{pane_current_path}"

bind-key -N "Show keybind cheatsheet" ? display-popup -w 60 -h 80% -E "less -R ~/.config/tmux/keybinds.txt"

# Session persistence (resurrect/continuum); restores panes and cwd only.
set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

# Catppuccin Mocha.
# Powerline-style bar: one clickable box per window across every session, touching (session:index name, current in mauve) | battery, clock. Path and git live on the focused line (Claude's status line, the shell prompt).
set -g status-position top
set -g status-interval 5
set -g status-left-length 250
set -g status-right-length 140
set -g status-style "bg=#1e1e2e,fg=#cdd6f4"
set -g status-left "#{S:#{?loop_last_flag,#{W:#[range=user|#{session_name}:#{window_index}]#{?#{&&:#{session_attached},#{window_active}},#[fg=#1e1e2e#,bg=#cba6f7#,bold] #{session_name}:#{window_index} #{window_name}#{?#{>:#{window_panes},1}, #{window_panes}p,}#{?window_zoomed_flag, Z,} #[nobold],#{?loop_last_flag,#[fg=#9399b2#,bg=#313244] #{session_name}:#{window_index} #{window_name}#{?#{>:#{window_panes},1}, #{window_panes}p,}#{?window_zoomed_flag, Z,} ,#[fg=#9399b2#,bg=#313244] #{session_name}:#{window_index} #{window_name}#{?#{>:#{window_panes},1}, #{window_panes}p,}#{?window_zoomed_flag, Z,} #[fg=#585b70#,bg=#313244]│}}#[norange default]},#{W:#[range=user|#{session_name}:#{window_index}]#{?#{&&:#{session_attached},#{window_active}},#[fg=#1e1e2e#,bg=#cba6f7#,bold] #{session_name}:#{window_index} #{window_name}#{?#{>:#{window_panes},1}, #{window_panes}p,}#{?window_zoomed_flag, Z,} #[nobold],#[fg=#9399b2#,bg=#313244] #{session_name}:#{window_index} #{window_name}#{?#{>:#{window_panes},1}, #{window_panes}p,}#{?window_zoomed_flag, Z,} #[fg=#585b70#,bg=#313244]│}#[norange default]}}}"
set -g window-status-separator ""
set -g window-status-format ""
set -g window-status-current-format ""
set -g status-right "#[bg=#1e1e2e]#[fg=#45475a,bg=#1e1e2e]#[fg=#cdd6f4,bg=#45475a] %H:%M "
# Click a tab to jump to that session's window (user ranges bypass the default window binding).
bind-key -n MouseDown1Status if -F "#{m:*:*,#{mouse_status_range}}" "run-shell \"tmux switch-client -t '#{mouse_status_range}'\""
set -g pane-border-style "fg=#45475a"
set -g pane-active-border-style "fg=#cba6f7"
set -g message-style "bg=#313244,fg=#cdd6f4"
set -g mode-style "bg=#cba6f7,fg=#1e1e2e"

# Plugins via tpm (bootstrapped on first run). Install with prefix + I.
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
if "test ! -d ~/.tmux/plugins/tpm" \
   "run 'git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm && ~/.tmux/plugins/tpm/bin/install_plugins'"
run '~/.tmux/plugins/tpm/tpm'
